<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Comfortaa:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
    :root {











      --shadow: 0 18px 48px rgba(37, 72, 45, .12);
      --radius: 22px;
      --max: 1460px;
      --reading: 760px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--cream);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: "Comfortaa", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      overflow-x: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    a { color: inherit; }
    button, a { font-family: inherit; }

    .page {
      width: 100%;
      overflow: hidden;
    }

    .wrap {
      width: min(calc(100% - 64px), var(--max));
      margin: 0 auto;
    }

    .narrow {
      width: min(calc(100% - 64px), var(--reading));
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green-mid);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1, h2, h3 { text-wrap: balance; }

    h1 {
      max-width: 900px;
      margin-bottom: 20px;
      color: #fff;
      font-size: clamp(2.3rem, 4.6vw, 4.75rem);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    h2 {
      margin-bottom: 18px;
      color: var(--green-dark);
      font-size: clamp(1.75rem, 3.1vw, 3.15rem);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    h3 {
      margin-bottom: 10px;
      color: var(--green-dark);
      font-size: 1.45rem;
      line-height: 1.25;
    }

    .lead {
      color: var(--muted);
      font-size: 1rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border: 1px solid transparent;
      border-radius: 999px;
      text-decoration: none;
      font-size: .94rem;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }

    .button:hover { transform: translateY(-2px); }

    .button-solid {
      background: var(--green);
      color: #fff;
      box-shadow: 0 9px 22px color-mix(in srgb, var(--green) 18%, transparent);
    }

    .button-solid:hover { background: var(--green-fill-dark); }

    .button-blue {
      background: var(--blue-dark);
    }

    .button-blue:hover {
      background: var(--blue);
    }

    .button-outline {
      border-color: color-mix(in srgb, var(--green) 34%, transparent);
      color: var(--green-dark);
      background: transparent;
    }

    .button-outline:hover { background: color-mix(in srgb, var(--green) 6%, transparent); }

    .button-light {
      color: var(--green-dark);
      background: #fff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .10);
    }

    .button-ghost-light {
      color: #fff;
      border-color: rgba(255,255,255,.58);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(3px);
    }

    .hero {
      position: relative;

      display: flex;
      align-items: flex-end;
      isolation: isolate;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--green-deep) 86%, transparent) 0%, color-mix(in srgb, var(--green-deep) 62%, transparent) 42%, color-mix(in srgb, var(--green-deep) 22%, tra[...]
        url("assets/images/home-hero-temp-a.png") 50% 50% / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 170px;
      z-index: -1;
      background: linear-gradient(to bottom, transparent, rgba(18, 50, 30, .30));
    }

    .hero-inner {
      width: min(calc(100% - 64px), var(--max));
      margin: 0 auto;
      padding: 110px 0 38px;
    }

    .hero .eyebrow { color: rgba(255,255,255,.82); }


    #home-title {
      max-width: none;
      margin: 0 0 24px;
      font-size: clamp(1.9rem, 2.35vw, 2.55rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
      text-align: left;
      white-space: nowrap;
    }


    #home-title .motto-dot {
      display: inline;
      margin: 0 .16em;
      color: rgba(255,255,255,.72);
      font-weight: 400;
    }

    .hero-copy {
      max-width: 700px;
      margin-bottom: 30px;
      color: rgba(255,255,255,.92);
      font-size: clamp(1rem, 1.5vw, 1.14rem);
    }

    .intro {
      padding: 62px 0;
      background: var(--paper);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      gap: clamp(36px, 6vw, 96px);
      align-items: center;
    }

    .intro-photo {
      min-height: 470px;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--green-dark) 4%, transparent), color-mix(in srgb, var(--green-dark) 10%, transparent)),
        url("assets/images/homepage-embedded/homepage-image-02.webp") 52% 48% / cover no-repeat;
      box-shadow: var(--shadow);
    }

    .intro-copy p:last-of-type { margin-bottom: 26px; }

    .orange-rule {
      width: 54px;
      height: 4px;
      margin: 0 0 22px;
      border-radius: 999px;
      background: var(--orange);
    }

    .phases {
      padding: 62px 0;
      background: var(--cream);
    }

    .section-heading {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      gap: 54px;
      align-items: end;
      margin-bottom: 42px;
    }

    .section-heading h2 { margin-bottom: 0; }
    .section-heading .lead { margin-bottom: 3px; }

    .phase-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .phase-card {
      position: relative;
      min-height: 430px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      border-radius: var(--radius);
      text-decoration: none;
      box-shadow: var(--shadow);
      isolation: isolate;
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .phase-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 22px 54px rgba(37, 72, 45, .17);
    }

    .phase-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-position: center;
      background-size: cover;
      transition: transform .35s ease;
    }

    .phase-card:hover::before { transform: scale(1.025); }

    .phase-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(to top, rgba(18,48,30,.88) 0%, rgba(18,48,30,.36) 48%, rgba(18,48,30,.06) 78%);
    }

    .phase-card.early::before {
      background-image: url("assets/images/homepage-embedded/homepage-image-03.webp");
      background-position: 50% 32%;
    }

    .phase-card.primary::before {
      background-image: url("assets/images/homepage-embedded/homepage-image-04.webp");
      background-position: 52% 48%;
    }

    .phase-card.secondary::before {
      background-image: url("assets/images/homepage-embedded/homepage-image-05.webp");
      background-position: 50% 48%;
    }

    .phase-content {
      width: 100%;
      padding: 30px;
      color: #fff;
    }

    .phase-content .phase-age {
      display: block;
      margin-bottom: 7px;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .84;
    }

    .phase-content h3 {
      margin-bottom: 9px;
      color: #fff;
      font-size: 1.65rem;
    }

    .phase-content p {
      margin-bottom: 16px;
      color: rgba(255,255,255,.88);
      font-size: .94rem;
    }

    .card-link {
      font-weight: 700;
      font-size: .91rem;
    }

    .identity {
      padding: 68px 0;
      background: var(--green-fill-dark);
      color: #fff;
    }

    .identity-grid {
      display: grid;
      grid-template-columns: 1.02fr .98fr;
      gap: clamp(34px, 6vw, 88px);
      align-items: center;
    }

    .identity h2 { color: #fff; }
    .identity .eyebrow {
      color: var(--green-wash);
      opacity: 1;
      font-weight: 800;
    }

    .identity-copy { max-width: 720px; }

    .identity-copy > p { color: rgba(255,255,255,.84); }

    .values {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      margin: 30px 0 34px;
      max-width: 760px;
    }

    .values::before {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 15px;
      height: 1px;
      background: rgba(230,160,103,.55);
    }

    .value {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 0;
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
    }

    .identity-photo {
      min-height: 500px;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--green-dark) 3%, transparent), color-mix(in srgb, var(--green-dark) 10%, transparent)),
        url("assets/images/homepage-embedded/homepage-image-06.webp") 55% 45% / cover no-repeat;
      box-shadow: 0 24px 52px rgba(0,0,0,.22);
    }

    .pathway {
      padding: 60px 0;
      background: var(--green-soft);
    }

    .pathway-card {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 50px;
      align-items: center;
      padding: clamp(30px, 4vw, 52px);
      border: 1px solid color-mix(in srgb, var(--green) 12%, transparent);
      border-radius: var(--radius);
      background: rgba(255,255,255,.78);
    }

    .pathway-card h2 { font-size: clamp(1.7rem, 2.6vw, 2.6rem); }

    .pathway-mark {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .pathway-mark-inner {
      max-width: 330px;
      padding-left: 28px;
      border-left: 4px solid var(--orange);
    }

    .pathway-mark strong {
      display: block;
      margin-bottom: 6px;
      color: var(--green-dark);
      font-size: 1.1rem;
    }

    .pathway-mark span {
      color: var(--muted);
      font-size: .92rem;
    }


    .wellbeing-feature {
      padding: 68px 0;
      background: var(--paper);
    }

    .wellbeing-card {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      min-height: 360px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--green) 12%, transparent);
      border-radius: var(--radius);
      background: var(--cream);
      box-shadow: var(--shadow);
    }

    .wellbeing-photo {
      min-height: 360px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--green-dark) 2%, transparent), color-mix(in srgb, var(--green-dark) 8%, transparent)),
        url("assets/images/homepage-embedded/homepage-image-07.webp") 52% 32% / cover no-repeat;
    }

    .wellbeing-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 5vw, 72px);
    }

    .wellbeing-copy h2 {
      max-width: 720px;
    }

    .wellbeing-copy p {
      max-width: 720px;
    }


    .green-initial {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e6a067;
      color: var(--green-deep);
      font-size: .96rem;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 0 0 6px var(--green);
    }

    .green-initial > span {
      display: block;
      transform: translate(-0.5px, 1px);
    }

    .green-rest {
      color: #fff;
      line-height: 1.25;
    }

    .quick-links {
      padding: 60px 0;
      color: #fff;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
    }

    .quick-links .eyebrow {
      color: var(--hero-blue-eyebrow) !important;
    }

    .quick-links h2 {
      color: #fff;
    }

    .quick-links .lead {
      color: rgba(255,255,255,.82);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }


    .quick-card strong,
    .quick-card span {
      display: block;
    }

    .quick-card strong {
      margin-bottom: 8px;
    }

    .quick-card {
      min-height: 178px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .quick-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--green) 28%, transparent);
      box-shadow: 0 12px 32px rgba(37,72,45,.09);
    }

    .quick-card strong {
      color: var(--green-dark);
      font-size: 1.04rem;
    }

    .quick-card span {
      color: var(--muted);
      font-size: .88rem;
    }

    .quick-arrow {
      margin-top: 22px;
      color: var(--orange);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .location-social {
      padding: 68px 0;
      background: var(--cream);
    }

    .location-social-heading {
      max-width: 760px;
      margin-bottom: 34px;
    }

    .location-social-heading h2 {
      margin-bottom: 0;
    }

    .location-social-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 500px;
      gap: 28px;
      align-items: stretch;
    }

    .location-panel,
    .facebook-panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--green) 12%, transparent);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .location-panel {
      display: flex;
      flex-direction: column;
    }

    .location-panel-head,
    .facebook-panel-head {
      padding: 26px 28px 22px;
    }

    .location-panel-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .location-panel h3,
    .facebook-panel h3 {
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 2vw, 1.7rem);
      color: var(--green-deep);
    }

    .location-panel p,
    .facebook-panel p {
      margin: 0;
      color: var(--muted);
    }

    .map-link {
      flex: 0 0 auto;
      color: var(--green-deep);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .map-frame {
      display: block;
      width: 100%;
      min-height: 600px;
      flex: 1 1 auto;
      border: 0;
    }

    .facebook-panel {
      display: flex;
      flex-direction: column;
    }

    .facebook-xfbml-wrap {
      width: 100%;
      min-height: 600px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      padding: 0 14px 18px;
      background: #fff;
    }

    .facebook-xfbml-wrap .fb-page {
      width: 100%;
      max-width: 500px;
    }

    @media (max-width: 1000px) {
      .location-social-grid {
        grid-template-columns: 1fr;
      }

      .map-frame {
        min-height: 480px;
      }

      .facebook-panel {
        max-width: 620px;
        width: 100%;
        margin: 0 auto;
      }
    }

    @media (max-width: 640px) {
      .location-social {
        padding: 64px 0;
      }

      .location-panel-head {
        display: block;
      }

      .map-link {
        display: inline-block;
        margin-top: 14px;
      }

      .map-frame {
        min-height: 400px;
      }

      .facebook-xfbml-wrap {
        padding-left: 0;
        padding-right: 0;
      }
    }



    .testimonials {
      padding: 64px 0;
      background: var(--cream);
    }

    .testimonial-shell {
      position: relative;
      max-width: 980px;
      min-height: 220px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .testimonial-card {
      grid-area: 1 / 1;
      width: 100%;
      padding: clamp(24px, 3vw, 36px);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .55s ease, transform .55s ease;
    }

    .testimonial-card.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    blockquote {
      max-width: 800px;
      margin: 0 auto 22px;
      color: var(--green-dark);
      font-size: clamp(1.2rem, 2.1vw, 1.75rem);
      line-height: 1.55;
    }

    cite {
      color: var(--muted);
      font-style: normal;
      font-weight: 700;
      font-size: .92rem;
    }

    .testimonial-dots {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-top: 7px;
    }

    .testimonial-dot {
      position: relative;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .testimonial-dot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--green) 22%, transparent);
      transform: translate(-50%,-50%);
      transition: background .18s ease, transform .18s ease;
    }

    .testimonial-dot:hover::before {
      transform: translate(-50%,-50%) scale(1.18);
    }

    .testimonial-dot.active::before { background: var(--green); }

    .final-cta {
      position: relative;
      padding: 70px 0;
      color: #fff;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
    }

    .final-cta .eyebrow {
      color: var(--hero-blue-eyebrow) !important;
    }

    .final-cta-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 44px;
      align-items: center;
    }

    .final-cta h2 {
      max-width: 900px;
      margin-bottom: 12px;
      color: #fff;
    }

    .final-cta p {
      max-width: 760px;
      margin-bottom: 0;
      color: rgba(255,255,255,.82);
    }

    @media (max-width: 980px) {
      .wellbeing-card {
        grid-template-columns: .9fr 1.1fr;
      }

      .wellbeing-photo {
        min-height: 350px;
      }

      .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .phase-card { min-height: 390px; }
    }

    @media (max-width: 860px) {
      .wrap, .narrow, .hero-inner {
        width: min(calc(100% - 36px), var(--max));
      }

      .hero {

        background-position: 58% center;
      }

      .intro, .phases, .identity, .quick-links, .testimonials, .final-cta {
        padding-top: 68px;
        padding-bottom: 68px;
      }

      .intro-grid,
      .section-heading,
      .identity-grid,
      .pathway-card,
      .final-cta-grid {
        grid-template-columns: 1fr;
      }

      .intro-photo, .identity-photo { min-height: 390px; }
      .section-heading { gap: 18px; }

      .values {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0;
        width: 100%;
        max-width: 680px;
      }

      .value {
        font-size: .74rem;
      }

      .phase-grid { grid-template-columns: 1fr; }
      .phase-card { min-height: 330px; }
      .pathway-mark { justify-content: flex-start; }
      .final-cta-grid { gap: 26px; }
    }

    @media (max-width: 980px) and (min-width: 981px) {

    }

    @media (max-width: 800px) {
      #home-title {
        width: fit-content;
      }

      #home-title .motto-dot { display: none; }

      #home-title .motto-line {
        display: block;
        text-align: center;
      }
    }

    @media (max-width: 720px) and (min-width: 561px) {

    }

    @media (max-width: 560px) {
      .hero { min-height: 560px; }
      .hero-inner { padding-top: 80px; padding-bottom: 52px; }
      h1 {
        font-size: 2.55rem;
        text-align: center;
      }

      h1 .motto-line {
        display: block;
      }

      h1 .motto-dot {
        display: none;
      }
      .button-row { display: grid; grid-template-columns: 1fr; }
      .button { width: 100%; }
      .intro-photo, .identity-photo { min-height: 300px; }
      .wellbeing-feature { padding: 64px 0; }

      .wellbeing-card {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .wellbeing-photo {
        min-height: 360px;
        background-position: 50% 42%;
      }

      .wellbeing-copy {
        padding: 34px 26px 38px;
      }


      #home-title {
        max-width: 100%;
        font-size: clamp(1.26rem, 4.76vw, 1.645rem);
        line-height: 1.12;
