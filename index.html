<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenacre International School - Website Draft</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Arial, sans-serif;
      background: #fbf8ef;
      color: #233126;
    }

    main {
      width: min(720px, 100%);
      padding: 52px 40px;
      text-align: center;
      background: white;
      border: 1px solid #dce7d4;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(35,49,38,.08);
    }

    .eyebrow {
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #39764a;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }

    p {
      margin: 0 auto;
      max-width: 560px;
      font-size: 1.05rem;
      line-height: 1.65;
      color: #566158;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">Greenacre International School · Koh Samui</div>
    <h1>New Website Draft</h1>
    <p>
      The new Greenacre International School website is being developed here.
      This temporary page confirms that the new independent website hosting is working correctly.
    </p>
  </main>
</body>
</html>
